<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日商簿記3級 合格特化型Web学習システム（全100問・高堅牢版）</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --success-bg: #f0fdf4;
      --success-border: #22c55e;
      --error-bg: #fef2f2;
      --error-border: #ef4444;
      --hint-bg: #fffbebf5;
      --hint-border: #f59e0b;
      --streak-color: #ea580c;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 15px;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      background-color: #0f172a;
      color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    header p {
      margin: 5px 0 0;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    /* ダッシュボードグリッド */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 15px;
    }

    .dash-card {
      background: var(--card-bg);
      padding: 12px 15px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .dash-card .title {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .dash-card .value {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--primary);
    }

    .dash-card .value.streak {
      color: var(--streak-color);
    }

    /* ツァイガルニク効果・進捗メーター */
    .progress-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px 15px;
      margin-bottom: 15px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background-color: var(--primary);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .problem-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .category-badge {
      background-color: #e0e7ff;
      color: #3730a3;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .statement {
      font-size: 1rem;
      margin-bottom: 15px;
      background-color: #f1f5f9;
      padding: 15px;
      border-radius: 6px;
      word-break: break-word;
    }

    /* ヒントエリア */
    .hint-toggle-btn {
      background: none;
      border: 1px solid var(--hint-border);
      color: #b45309;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 15px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .hint-toggle-btn:hover {
      background-color: #fef3c7;
    }

    .hint-box {
      background-color: var(--hint-bg);
      border-left: 4px solid var(--hint-border);
      padding: 12px;
      border-radius: 0 4px 4px 0;
      margin-bottom: 15px;
      font-size: 0.9rem;
      color: #78350f;
      display: none;
    }

    /* 入力エリア */
    .entry-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }

    @media (max-width: 600px) {
      .entry-grid {
        grid-template-columns: 1fr;
      }
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 8px;
      color: #334155;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
      font-size: 0.9rem;
    }

    .row-input {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    select, input[type="number"] {
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.9rem;
      outline: none;
    }

    select:focus, input[type="number"]:focus {
      border-color: var(--primary);
    }

    select {
      flex: 1.3;
      width: 0; /* フレックス縮小バグ防止 */
    }

    input[type="number"] {
      flex: 1;
      width: 0;
    }

    .btn-remove-row {
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #64748b;
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .result-box {
      margin-top: 15px;
      padding: 15px;
      border-radius: 6px;
      display: none;
    }

    .result-box.correct {
      background-color: var(--success-bg);
      border: 1px solid var(--success-border);
      color: #14532d;
    }

    .result-box.incorrect {
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: #7f1d1d;
    }

    .explanation-box {
      margin-top: 12px;
      padding: 12px;
      background-color: #ffffff;
      border-left: 4px solid var(--primary);
      font-size: 0.9rem;
      color: #334155;
    }

    .self-eval-buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .eval-btn {
      flex: 1;
      padding: 10px 5px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: #ffffff;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .eval-btn:hover {
      background-color: #e2e8f0;
    }

    .add-row-btn {
      background: none;
      border: 1px dashed var(--primary);
      color: var(--primary);
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      width: 100%;
      margin-top: 5px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>日商簿記3級 合格特化型演習システム</h1>
    <p>TAC講師監修 (全100問) × 行動心理学エンジン × 高信頼性アーキテクチャ</p>
  </header>

  <!-- ダッシュボード -->
  <div class="dashboard">
    <div class="dash-card">
      <div class="title">総問題数</div>
      <div class="value" id="stat-total">100</div>
    </div>
    <div class="dash-card">
      <div class="title">本日復習対象</div>
      <div class="value" id="stat-due">0</div>
    </div>
    <div class="dash-card">
      <div class="title">連続学習記録</div>
      <div class="value streak" id="stat-streak">0 日</div>
    </div>
    <div class="dash-card">
      <div class="title">平均定着度 (Ease)</div>
      <div class="value" id="stat-ease">2.50</div>
    </div>
  </div>

  <!-- 本日の学習進捗メーター -->
  <div class="progress-container">
    <div class="progress-header">
      <span>本日の目標進捗</span>
      <span id="progress-text">0 / 0 問完了</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
  </div>

  <!-- クイズメインカード -->
  <div class="card" id="quiz-card">
    <div class="problem-header">
      <span class="category-badge" id="problem-category">カテゴリー</span>
      <span id="problem-id-text" style="color: var(--text-muted); font-size: 0.85rem;">Q001</span>
    </div>

    <div class="statement" id="problem-statement">
      問題文を読み込んでいます...
    </div>

    <button class="hint-toggle-btn" onclick="toggleHint()">
      💡 初学者向けヒントを表示/非表示
    </button>
    <div class="hint-box" id="hint-box">
      <!-- ヒント本文 -->
    </div>

    <div class="entry-grid">
      <!-- 借方入力部分 -->
      <div>
        <div class="section-title">借方（左側）</div>
        <div id="debit-rows"></div>
        <button class="add-row-btn" onclick="addRow('debit')">+ 行を追加</button>
      </div>

      <!-- 貸方入力部分 -->
      <div>
        <div class="section-title">貸方（右側）</div>
        <div id="credit-rows"></div>
        <button class="add-row-btn" onclick="addRow('credit')">+ 行を追加</button>
      </div>
    </div>

    <button class="btn" id="submit-btn" onclick="checkAnswer()">解答を提出する</button>

    <!-- 結果・解説エリア -->
    <div class="result-box" id="result-box">
      <div id="result-title" style="font-weight: bold; font-size: 1.05rem;"></div>
      <div id="result-detail" style="margin-top: 4px;"></div>
      
      <div class="explanation-box" id="explanation-box"></div>

      <div style="margin-top: 15px; font-weight: bold; font-size: 0.85rem;">自覚難易度の選択（次回復習間隔へ自動反映）:</div>
      <div class="self-eval-buttons">
        <button class="eval-btn" onclick="applySelfEval(0)">完全不可 / 誤答<br>(1日後再出題)</button>
        <button class="eval-btn" onclick="applySelfEval(2)">正解・悩んだ<br>(標準間隔)</button>
        <button class="eval-btn" onclick="applySelfEval(3)">即答・完璧<br>(長期延長)</button>
      </div>
    </div>
  </div>

  <button class="btn btn-secondary" onclick="nextQuestion()">次の問題へ進む ➔</button>
</div>

<script>
'use strict';

// --- 全100問 完全データベース ---
const QUESTION_DATABASE = [
  // 1. 商品売買・手付金・発送費 (Q001 - Q018)
  {
    id: "Q001",
    category: "商品売買・手付金",
    statement: "丸の内商事株式会社は、得意先より商品 ￥500,000 の注文を受け、あらかじめ手付金として ￥100,000 を普通預金で受け取っていた。本日商品を発送し、残額 ￥400,000 は掛けとした。なお、当店負担の発送費用 ￥5,000 は現金で支払った。",
    hint: "①「あらかじめ受け取っていた手付金」＝前受金（負債）を減らす（借方）。②「売り手側が負担した発送費」＝発送費（費用）として独立して計上（借方）。",
    options: ["前受金", "売掛金", "発送費", "売上", "現金", "普通預金"],
    debit: [{ account: "前受金", amount: 100000 }, { account: "売掛金", amount: 400000 }, { account: "発送費", amount: 5000 }],
    credit: [{ account: "売上", amount: 500000 }, { account: "現金", amount: 5000 }],
    explanation: "【TAC講師解説】手付金受領時は3級標準の「前受金（負債）」を振り替えます。当店負担の発送費は独立した費用「発送費」で処理します。"
  },
  {
    id: "Q002",
    category: "商品売買・仕入手付金",
    statement: "仕入先より商品 ￥300,000 を仕入れ、以前に内金として支払っていた ￥50,000 を差し引き、残額は掛けとした。なお、先方負担の引取費用 ￥3,000 を当店が現金で立替払いした。",
    hint: "①「支払っていた内金」＝前払金（資産）の減少（貸方）。②先方負担費用を代わりに払った＝立替金（資産）の増加（借方）。",
    options: ["仕入", "立替金", "前払金", "買掛金", "現金"],
    debit: [{ account: "仕入", amount: 300000 }, { account: "立替金", amount: 3000 }],
    credit: [{ account: "前払金", amount: 50000 }, { account: "買掛金", amount: 250000 }, { account: "現金", amount: 3000 }],
    explanation: "【TAC講師解説】内金支払分は「前払金（資産）」の減少。先方負担費用を立て替えた場合は「立替金（資産）」とします。"
  },
  {
    id: "Q003",
    category: "商品売買・仕入引取費用",
    statement: "商品 ￥200,000 を仕入れ、代金は掛けとした。なお、当店負担の引取運賃 ￥4,000 は現金で支払った。",
    hint: "「当店（買い手）が負担した仕入諸掛り」は『仕入原価』にプラスします（仕入＝204,000円）。",
    options: ["仕入", "買掛金", "現金", "発送費"],
    debit: [{ account: "仕入", amount: 204000 }],
    credit: [{ account: "買掛金", amount: 200000 }, { account: "現金", amount: 4000 }],
    explanation: "【TAC講師解説】当店負担の『購入（仕入）諸掛り』は仕入原価に含めます（仕入金額 ＝ 200,000 ＋ 4,000 ＝ 204,000）。"
  },
  {
    id: "Q004",
    category: "商品売買・売上割引",
    statement: "売掛金 ￥150,000 について、支払期日前に現金で回収したため、約束に基づき ￥1,500 を割り引き、残額 ￥148,500 を当座預金口座に振り込まれた。",
    hint: "期日前の早期回収に伴う割引（利息的免除）は「売上割引（費用）」で処理します。",
    options: ["当座預金", "売上割引", "売掛金", "売上値引"],
    debit: [{ account: "当座預金", amount: 148500 }, { account: "売上割引", amount: 1500 }],
    credit: [{ account: "売掛金", amount: 150000 }],
    explanation: "【TAC講師解説】期日前の期日繰上回収に伴う免除額は「売上割引（営業外費用）」として処理します。"
  },
  {
    id: "Q005",
    category: "キャッシュレス決済",
    statement: "一般顧客に対して商品 ￥120,000 を販売し、代金はクレジットカードで決済された。信販会社への手数料（販売代金の 2%）は販売時に計上する。",
    hint: "①クレカ売上＝「クレジット売掛金（資産）」。②手数料＝「支払手数料（費用）」（120,000×2%＝2,400円）。",
    options: ["クレジット売掛金", "支払手数料", "売上"],
    debit: [{ account: "クレジット売掛金", amount: 117600 }, { account: "支払手数料", amount: 2400 }],
    credit: [{ account: "売上", amount: 120000 }],
    explanation: "【TAC講師解説】クレジット売買。手数料（120,000×2%＝2,400）を「支払手数料」、差額を「クレジット売掛金」とします。"
  },
  {
    id: "Q006",
    category: "商品売買・値引き",
    statement: "得意先に販売した商品に破損があったため、売り上げた商品 ￥80,000 のうち ￥8,000 の値引きを行い、売掛金から控除した。",
    hint: "売上値引きは「売上」を直接マイナス（借方へ記入）します。",
    options: ["売上", "売掛金"],
    debit: [{ account: "売上", amount: 8000 }],
    credit: [{ account: "売掛金", amount: 8000 }],
    explanation: "【TAC講師解説】売上値引きは「売上（収益）」の直接取消（借方記入）を行います。"
  },
  {
    id: "Q007",
    category: "商品売買・返品（返戻）",
    statement: "仕入れた商品のうち、品違いのため ￥25,000 を返品し、買掛金と相殺した。",
    hint: "仕入返品は「仕入（費用）」を直接マイナス（貸方へ記入）し、同時に「買掛金（負債）」を減らします（借方）。",
    options: ["買掛金", "仕入"],
    debit: [{ account: "買掛金", amount: 25000 }],
    credit: [{ account: "仕入", amount: 25000 }],
    explanation: "【TAC講師解説】仕入返品は「仕入（費用）」の直接取消（貸方記入）を行います。"
  },
  {
    id: "Q008",
    category: "商品売買・先方負担発送費",

    hint: "先方（相手）負担の発送費を代わりに払った場合は「立替金（資産）」として計上します。",
    options: ["売掛金", "立替金", "売上", "現金"],
    debit: [{ account: "売掛金", amount: 180000 }, { account: "立替金", amount: 3000 }],
    credit: [{ account: "売上", amount: 180000 }, { account: "現金", amount: 3000 }],
    explanation: "【TAC講師解説】先方負担の発送費を立て替えた場合は「立替金」処理します。"
  },
  {
    id: "Q009",
    category: "商品売買・前払金の精算",
    statement: "以前に注文を行っていた商品 ￥400,000 が到着し、内金 ￥80,000 を差し引いた残額を掛けとした。",
    hint: "商品が届いたので「仕入（費用）」が発生。過去に支払った内金「前払金（資産）」を取り崩します（貸方）。",
    options: ["仕入", "前払金", "買掛金"],
    debit: [{ account: "仕入", amount: 400000 }],
    credit: [{ account: "前払金", amount: 80000 }, { account: "買掛金", amount: 320000 }],
    explanation: "【TAC講師解説】商品引き渡しを受けたため「仕入」を計上し、既払い内金「前払金」を取り崩します。"
  },
  {
    id: "Q010",
    category: "商品売買・商品券の受取",
    statement: "商品 ￥50,000 を販売し、代金のうち ￥30,000 は他店発行の商品券で受け取り、残額 ￥20,000 は現金で受け取った。",
    hint: "他社が発行した商品券を受け取ったときは「受取商品券（資産）」勘定を使います。",
    options: ["受取商品券", "現金", "売上"],
    debit: [{ account: "受取商品券", amount: 30000 }, { account: "現金", amount: 20000 }],
    credit: [{ account: "売上", amount: 50000 }],
    explanation: "【TAC講師解説】他店発行の商品券を受け取った場合は「受取商品券（資産）」で処理します。"
  },
  {
    id: "Q011",
    category: "商品売買・自店発行商品券",
    statement: "自店が発行した商品券 ￥10,000 を持参した顧客に商品 ￥10,000 を引き渡した。",
    hint: "自店が発行した商品券が戻ってきたときは、負債である「商品券」を減少（借方）させます。",
    options: ["商品券", "売上"],
    debit: [{ account: "商品券", amount: 10000 }],
    credit: [{ account: "売上", amount: 10000 }],
    explanation: "【TAC講師解説】自店発行商品券の回収時は、負債である「商品券」を減少し「売上」を計上します。"
  },
  {
    id: "Q012",
    category: "商品売買・贈答用商品券購入",
    statement: "得意先への贈答用として、商品券 ￥20,000 を現金で購入した。",
    hint: "自社でプレゼント用として購入した商品券は「交際費（費用）」として処理します。",
    options: ["交際費", "現金"],

// --- エンジニアリング基準：堅牢なデータ保存 & 例外ハンドリング ---
class StorageManager {
  static KEY = 'boki3_system_state_v1';

  static loadState() {
    try {
      const serialized = localStorage.getItem(this.KEY);
      if (!serialized) return this.getDefaultState();
      const parsed = JSON.parse(serialized);
      // 型チェックおよびキー存在保証
      if (typeof parsed !== 'object' || parsed === null) return this.getDefaultState();
      return {
        progress: parsed.progress || {},
        streak: typeof parsed.streak === 'number' ? parsed.streak : 0,
        lastStudyDate: parsed.lastStudyDate || null,
        todayCount: typeof parsed.todayCount === 'number' ? parsed.todayCount : 0
      };
    } catch (e) {
      console.warn('LocalStorage error or corrupt data, resetting state:', e);
      return this.getDefaultState();
    }
  }

  static saveState(state) {
    try {
      localStorage.setItem(this.KEY, JSON.stringify(state));
    } catch (e) {
      console.error('Failed to save state to LocalStorage:', e);
    }
  }

  static getDefaultState() {
    return {
      progress: {},
      streak: 0,
      lastStudyDate: null,
      todayCount: 0
    };
  }
}

// アプリケーション状態
let state = StorageManager.loadState();
let currentQuestionIndex = 0;
let currentErrorType = 'NONE';

// 日付ユーティリティ（タイムゾーン安全）
function getTodayString() {
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

// ストリーク & 当日進捗計算
function checkDailyStreak() {
  const today = getTodayString();
  if (!state.lastStudyDate) return;

  const lastDate = new Date(state.lastStudyDate);
  const currentDate = new Date(today);
  const diffDays = Math.round((currentDate - lastDate) / (1000 * 60 * 60 * 24));

  if (diffDays === 1) {
    // 連続学習成功
  } else if (diffDays > 1) {
    // 1日以上空いた場合はストリークリセット
    state.streak = 0;
    state.todayCount = 0;
  }

  if (state.lastStudyDate !== today) {
    state.todayCount = 0; // 日付が変わっていたら当日の回答カウントリセット
  }
}

// ダッシュボードUI更新
function updateDashboard() {
  checkDailyStreak();

  const total = QUESTION_DATABASE.length;
  let dueCount = 0;
  let totalEase = 0;
  const now = new Date();

  QUESTION_DATABASE.forEach(q => {
    const p = state.progress[q.id];
    if (p) {
      if (new Date(p.nextReviewDate) <= now) dueCount++;
      totalEase += p.easeFactor;
    } else {
      dueCount++;
      totalEase += 2.5;
    }
  });

  document.getElementById('stat-total').innerText = total;
  document.getElementById('stat-due').innerText = dueCount;
  document.getElementById('stat-streak').innerText = `${state.streak} 日`;
  document.getElementById('stat-ease').innerText = (totalEase / total).toFixed(2);

  // プログレスバー更新（1日目標：最低10問）
  const targetGoal = Math.max(dueCount, 10);
  const percent = Math.min(Math.round((state.todayCount / targetGoal) * 100), 100);
  document.getElementById('progress-bar').style.width = `${percent}%`;
  document.getElementById('progress-text').innerText = `${state.todayCount} / ${targetGoal} 問完了`;
}

// 問題レンダリング
function loadQuestion(index) {
  if (index < 0 || index >= QUESTION_DATABASE.length) index = 0;
  currentQuestionIndex = index;
  const q = QUESTION_DATABASE[index];

  document.getElementById('problem-category').innerText = q.category;
  document.getElementById('problem-id-text').innerText = `ID: ${q.id} (${index + 1} / ${QUESTION_DATABASE.length})`;
  document.getElementById('problem-statement').innerText = q.statement;

  const hintBox = document.getElementById('hint-box');
  hintBox.innerText = q.hint || "ヒントはありません。問題文の仕訳構造を考えましょう。";
  hintBox.style.display = 'none';

  document.getElementById('result-box').style.display = 'none';

  // 入力行クリア＆再生成
  document.getElementById('debit-rows').innerHTML = '';
  document.getElementById('credit-rows').innerHTML = '';

  for (let i = 0; i < Math.max(q.debit.length, 1); i++) addRow('debit');
  for (let i = 0; i < Math.max(q.credit.length, 1); i++) addRow('credit');
}

function addRow(side) {
  const container = document.getElementById(`${side}-rows`);
  const q = QUESTION_DATABASE[currentQuestionIndex];

  const div = document.createElement('div');
  div.className = 'row-input';

  let optionsHtml = '<option value="">(勘定科目を選択)</option>';
  q.options.forEach(opt => {
    optionsHtml += `<option value="${escapeHtml(opt)}">${escapeHtml(opt)}</option>`;
  });

  div.innerHTML = `
    <select class="${side}-account">${optionsHtml}</select>
    <input type="number" class="${side}-amount" placeholder="金額" min="0" step="100">
    <button type="button" class="btn-remove-row" onclick="removeRow(this)">✕</button>
  `;
  container.appendChild(div);
}

function removeRow(btn) {
  const row = btn.parentElement;
  const container = row.parentElement;
  if (container.children.length > 1) {
    row.remove();
  } else {
    // 1行しか残っていない場合はクリア
    row.querySelector('select').value = '';
    row.querySelector('input').value = '';
  }
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, function(m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
  });
}

function toggleHint() {
  const hintBox = document.getElementById('hint-box');
  hintBox.style.display = (hintBox.style.display === 'block') ? 'none' : 'block';
}

function getEntries(side) {
  const accounts = document.querySelectorAll(`.${side}-account`);
  const amounts = document.querySelectorAll(`.${side}-amount`);
  const entries = [];

  for (let i = 0; i < accounts.length; i++) {
    const acc = accounts[i].value;
    const amt = parseInt(amounts[i].value, 10);
    if (acc && !isNaN(amt) && amt > 0) {
      entries.push({ account: acc, amount: amt });
    }
  }
  return entries;
}

function compareEntries(user, correct) {
  if (user.length !== correct.length) return false;
  const sortUser = [...user].sort((x, y) => x.account.localeCompare(y.account));
  const sortCorrect = [...correct].sort((x, y) => x.account.localeCompare(y.account));

  for (let i = 0; i < sortUser.length; i++) {
    if (sortUser[i].account !== sortCorrect[i].account || sortUser[i].amount !== sortCorrect[i].amount) {
      return false;
    }
  }
  return true;
}

function checkAnswer() {
  const q = QUESTION_DATABASE[currentQuestionIndex];
  const userDebit = getEntries('debit');
  const userCredit = getEntries('credit');

  const debitCorrect = compareEntries(userDebit, q.debit);
  const creditCorrect = compareEntries(userCredit, q.credit);

  const resultBox = document.getElementById('result-box');
  const resultTitle = document.getElementById('result-title');
  const resultDetail = document.getElementById('result-detail');
  const expBox = document.getElementById('explanation-box');

  resultBox.style.display = 'block';

  if (debitCorrect && creditCorrect) {
    resultBox.className = 'result-box correct';
    resultTitle.innerText = '正解！ (Correct)';
    resultDetail.innerText = '勘定科目・金額ともに貸借一致しています。';
    currentErrorType = 'NONE';
  } else {
    resultBox.className = 'result-box incorrect';
    resultTitle.innerText = '不正解 (Incorrect)';
    
    if (!debitCorrect && !creditCorrect) {
      currentErrorType = 'CONCEPT';
      resultDetail.innerText = '借方・貸方ともに不一致です。問題文の取引構造を再確認しましょう。';
    } else {
      currentErrorType = 'ACCOUNT_ITEM';
      resultDetail.innerText = '勘定科目の選択または数値計算にミスがあります。';
    }
  }

  expBox.innerText = q.explanation;
}

// SM-2アルゴリズム ＆ 心理学ストリーク計算
function applySelfEval(quality) {
  const q = QUESTION_DATABASE[currentQuestionIndex];
  const today = getTodayString();

  // ストリーク＆進捗カウントの更新
  if (state.lastStudyDate !== today) {
    state.streak = (state.lastStudyDate) ? state.streak + 1 : 1;
    state.lastStudyDate = today;
  }
  state.todayCount += 1;

  // SM-2 パラメータ計算
  let p = state.progress[q.id] || {
    intervalDays: 0,
    repetitionCount: 0,
    easeFactor: 2.50,
    nextReviewDate: new Date().toISOString()
  };

  let { intervalDays, repetitionCount, easeFactor } = p;

  if (quality < 2) {
    repetitionCount = 0;
    intervalDays = 1;
  } else {
    if (repetitionCount === 0) intervalDays = 1;
    else if (repetitionCount === 1) intervalDays = 3;
    else intervalDays = Math.round(intervalDays * easeFactor);
    repetitionCount++;
  }

  // 難易度係数（EaseFactor）更新
  easeFactor = easeFactor + (0.1 - (3 - quality) * (0.08 + (3 - quality) * 0.02));
  if (currentErrorType === 'ACCOUNT_ITEM') easeFactor -= 0.05;
  if (currentErrorType === 'CONCEPT') easeFactor -= 0.10;
  if (easeFactor < 1.3) easeFactor = 1.3;

  const nextDate = new Date();
  nextDate.setDate(nextDate.getDate() + intervalDays);

  state.progress[q.id] = {
    intervalDays,
    repetitionCount,
    easeFactor: parseFloat(easeFactor.toFixed(2)),
    nextReviewDate: nextDate.toISOString(),
    lastReviewed: new Date().toISOString()
  };

  StorageManager.saveState(state);
  updateDashboard();
  nextQuestion();
}

function nextQuestion() {
  let nextIdx = (currentQuestionIndex + 1) % QUESTION_DATABASE.length;
  loadQuestion(nextIdx);
}

// アプリケーション初期化
window.addEventListener('DOMContentLoaded', () => {
  updateDashboard();
  loadQuestion(0);
});
</script>
