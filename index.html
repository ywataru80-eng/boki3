<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日商簿記3級 仕訳特化型演習システム（2026年度出題区分対応）</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --success-bg: #f0fdf4;
      --success-border: #22c55e;
      --error-bg: #fef2f2;
      --error-border: #ef4444;
      --hint-bg: #fffbebf5;
      --hint-border: #f59e0b;
      --streak-color: #ea580c;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 15px;
      line-height: 1.6;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
    }

    header {
      background-color: #0f172a;
      color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    header p {
      margin: 5px 0 0;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    /* ダッシュボード */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 15px;
    }

    .dash-card {
      background: var(--card-bg);
      padding: 12px 15px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .dash-card .title {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .dash-card .value {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--primary);
    }

    .dash-card .value.streak {
      color: var(--streak-color);
    }

    /* 進捗メーター */
    .progress-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px 15px;
      margin-bottom: 15px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background-color: var(--primary);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .problem-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .category-badge {
      background-color: #e0e7ff;
      color: #3730a3;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .statement {
      font-size: 1rem;
      margin-bottom: 15px;
      background-color: #f1f5f9;
      padding: 15px;
      border-radius: 6px;
      word-break: break-word;
    }

    /* ヒント */
    .hint-toggle-btn {
      background: none;
      border: 1px solid var(--hint-border);
      color: #b45309;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 15px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .hint-toggle-btn:hover {
      background-color: #fef3c7;
    }

    .hint-box {
      background-color: var(--hint-bg);
      border-left: 4px solid var(--hint-border);
      padding: 12px;
      border-radius: 0 4px 4px 0;
      margin-bottom: 15px;
      font-size: 0.9rem;
      color: #78350f;
      display: none;
    }

    /* 横並び仕訳テーブル */
    .journal-table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin-bottom: 15px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .journal-table {
      width: 100%;
      min-width: 600px;
      border-collapse: collapse;
      background-color: #ffffff;
    }

    .journal-table th, .journal-table td {
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      text-align: center;
      vertical-align: middle;
    }

    .journal-table th {
      background-color: #f1f5f9;
      font-size: 0.85rem;
      color: #334155;
      font-weight: bold;
    }

    .journal-table th.th-debit {
      background-color: #eff6ff;
      color: #1e40af;
      border-bottom: 2px solid #3b82f6;
    }

    .journal-table th.th-credit {
      background-color: #fef2f2;
      color: #991b1b;
      border-bottom: 2px solid #ef4444;
    }

    .journal-table td select, .journal-table td input[type="number"] {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.9rem;
      outline: none;
    }

    .journal-table td select:disabled, .journal-table td input[type="number"]:disabled {
      background-color: #f1f5f9;
      color: #64748b;
      cursor: not-allowed;
    }

    .journal-table td select:focus, .journal-table td input[type="number"]:focus {
      border-color: var(--primary);
    }

    .btn-remove-row {
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-remove-row:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .add-row-btn {
      background: #f1f5f9;
      color: #334155;
      border: 1px dashed var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 15px;
      width: 100%;
    }

    .add-row-btn:hover:not(:disabled) {
      background: #e2e8f0;
    }

    .add-row-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      transition: background 0.2s, opacity 0.2s;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result-box {
      margin-top: 15px;
      padding: 15px;
      border-radius: 6px;
      display: none;
    }

    .result-box.correct {
      background-color: var(--success-bg);
      border: 1px solid var(--success-border);
      color: #14532d;
    }

    .result-box.incorrect {
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: #7f1d1d;
    }

    /* 正解仕訳表示ボックス */
    .correct-journal-box {
      margin-top: 12px;
      padding: 12px;
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .correct-journal-title {
      font-weight: bold;
      font-size: 0.9rem;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .correct-journal-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .correct-journal-table th, .correct-journal-table td {
      padding: 8px 10px;
      border: 1px solid var(--border-color);
    }

    .correct-journal-table th {
      font-weight: bold;
      font-size: 0.85rem;
    }

    .correct-journal-table th.th-debit {
      color: #1e40af;
      background-color: #eff6ff;
      border-bottom: 2px solid #3b82f6;
    }

    .correct-journal-table th.th-credit {
      color: #991b1b;
      background-color: #fef2f2;
      border-bottom: 2px solid #ef4444;
    }

    .correct-journal-table td {
      vertical-align: top;
      background-color: #ffffff;
    }

    .explanation-box {
      margin-top: 12px;
      padding: 12px;
      background-color: #ffffff;
      border-left: 4px solid var(--primary);
      font-size: 0.9rem;
      color: #334155;
    }

    .self-eval-buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .eval-btn {
      flex: 1;
      padding: 10px 5px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: #ffffff;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: background 0.2s, opacity 0.2s;
    }

    .eval-btn:hover:not(:disabled) {
      background-color: #e2e8f0;
    }

    .eval-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background-color: #f1f5f9;
    }

    .completion-message {
      text-align: center;
      padding: 30px 15px;
    }

    .completion-message h2 {
      color: #166534;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>日商簿記3級 仕訳特化型演習システム</h1>
    <p>2026年度出題区分対応 (全100問) × 標準仕訳表形式 × SM-2改復習アルゴリズム</p>
  </header>

  <!-- ダッシュボード -->
  <div class="dashboard">
    <div class="dash-card">
      <div class="title">総問題数</div>
      <div class="value" id="stat-total">100</div>
    </div>
    <div class="dash-card">
      <div class="title">復習待ち</div>
      <div class="value" id="stat-due">0</div>
    </div>
    <div class="dash-card">
      <div class="title">未学習</div>
      <div class="value" id="stat-unstudied">100</div>
    </div>
    <div class="dash-card">
      <div class="title">連続学習記録</div>
      <div class="value streak" id="stat-streak">0 日</div>
    </div>
    <div class="dash-card">
      <div class="title">平均Ease係数</div>
      <div class="value" id="stat-ease">2.50</div>
    </div>
  </div>

  <!-- 進捗メーター -->
  <div class="progress-container">
    <div class="progress-header">
      <span>本日の目標進捗</span>
      <span id="progress-text">0 / 10 問完了</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
  </div>

  <!-- 問題カード -->
  <div class="card" id="quiz-card">
    <div class="problem-header">
      <span class="category-badge" id="problem-category">カテゴリー</span>
      <span id="problem-id-text" style="color: var(--text-muted); font-size: 0.85rem;">Q001</span>
    </div>

    <div class="statement" id="problem-statement">
      問題文を読み込んでいます...
    </div>

    <button type="button" class="hint-toggle-btn" onclick="toggleHint()">
      💡 ヒントを表示/非表示
    </button>
    <div class="hint-box" id="hint-box"></div>

    <!-- 横並び解答欄（標準仕訳帳形式） -->
    <div class="journal-table-wrapper" id="journal-wrapper">
      <table class="journal-table">
        <thead>
          <tr>
            <th colspan="2" class="th-debit">借方（左側）</th>
            <th colspan="2" class="th-credit">貸方（右側）</th>
            <th style="width: 50px;">削除</th>
          </tr>
          <tr>
            <th style="width: 32%;">勘定科目</th>
            <th style="width: 18%;">金額</th>
            <th style="width: 32%;">勘定科目</th>
            <th style="width: 18%;">金額</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="journal-rows">
          <!-- 動的に行を追加 -->
        </tbody>
      </table>
    </div>

    <button type="button" class="add-row-btn" id="add-row-btn" onclick="addJournalRow()">+ 複合仕訳用の行を追加する</button>

    <button type="button" class="btn" id="submit-btn" onclick="checkAnswer()">解答を提出する</button>

    <!-- 解答・解説エリア -->
    <div class="result-box" id="result-box">
      <div id="result-title" style="font-weight: bold; font-size: 1.05rem;"></div>
      <div id="result-detail" style="margin-top: 4px;"></div>

      <!-- 正解仕訳表示エリア -->
      <div class="correct-journal-box" id="correct-journal-box">
        <div class="correct-journal-title">正解の仕訳:</div>
        <div id="correct-journal-content"></div>
      </div>

      <div class="explanation-box" id="explanation-box"></div>

      <div style="margin-top: 15px; font-weight: bold; font-size: 0.85rem;" id="eval-instruction">自覚難易度の選択（選択後に次の問題へ自動進みます）:</div>
      <div class="self-eval-buttons">
        <button type="button" class="eval-btn" id="eval-btn-0" onclick="applySelfEval(0)" disabled>要復習 / 不正解<br>(1日後再出題)</button>
        <button type="button" class="eval-btn" id="eval-btn-2" onclick="applySelfEval(2)" disabled>正解・やや不安<br>(標準間隔)</button>
        <button type="button" class="eval-btn" id="eval-btn-3" onclick="applySelfEval(3)" disabled>正解・即答できた<br>(長期延長)</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

// 全100問データベース（2026年度適用 出題区分対応・校正済みテキスト）
const QUESTION_DATABASE = [
  // 1. 商品売買・手付金・発送費 (Q001 - Q018)
  {
    id: "Q001",
    category: "商品売買・手付金",
    statement: "丸の内商事株式会社は、得意先より商品 ￥500,000 の注文を受け、あらかじめ手付金として ￥100,000 を普通預金で受け取っていた。本日商品を発送し、残額 ￥400,000 は掛けとした。なお、当店負担の発送費用 ￥5,000 は現金で支払った。",
    hint: "受取済の手付金は「前受金（負債）」の取り崩し、当店負担の発送費は「発送費（費用）」として独立計上します。",
    options: ["前受金", "売掛金", "発送費", "売上", "現金", "普通預金"],
    debit: [{ account: "前受金", amount: 100000 }, { account: "売掛金", amount: 400000 }, { account: "発送費", amount: 5000 }],
    credit: [{ account: "売上", amount: 500000 }, { account: "現金", amount: 5000 }],
    explanation: "前受金の解消（借方）と残額の売掛金計上を行います。当店負担の発送費は「発送費」で処理します。"
  },
  {
    id: "Q002",
    category: "商品売買・仕入手付金",
    statement: "仕入先より商品 ￥300,000 を仕入れ、以前に内金として支払っていた ￥50,000 を差し引き、残額は掛けとした。なお、先方負担の引取費用 ￥3,000 を当店が現金で立替払いした。",
    hint: "既払内金は「前払金（資産）」の減少。取引先負担の費用立替は「立替金（資産）」です。",
    options: ["仕入", "立替金", "前払金", "買掛金", "現金"],
    debit: [{ account: "仕入", amount: 300000 }, { account: "立替金", amount: 3000 }],
    credit: [{ account: "前払金", amount: 50000 }, { account: "買掛金", amount: 250000 }, { account: "現金", amount: 3000 }],
    explanation: "仕入高 300,000円を計上し、前払金を相殺した残額を買掛金とします。先方負担の費用は「立替金」で処理します。"
  },
  {
    id: "Q003",
    category: "商品売買・仕入引取費用",
    statement: "商品 ￥200,000 を仕入れ、代金は掛けとした。なお、当店負担の引取運賃 ￥4,000 は現金で支払った。",
    hint: "買主負担の仕入諸掛りは、商品の購入原価（仕入）に加算します。",
    options: ["仕入", "買掛金", "現金", "発送費"],
    debit: [{ account: "仕入", amount: 204000 }],
    credit: [{ account: "買掛金", amount: 200000 }, { account: "現金", amount: 4000 }],
    explanation: "当店負担の引取運賃は仕入原価に含めます（200,000 ＋ 4,000 ＝ 204,000円）。"
  },
  {
    id: "Q004",
    category: "商品売買・売上返品",
    statement: "得意先より、先に掛けで販売した商品 ￥20,000 について品違いのため返品を受け、売掛金と相殺した。",
    hint: "売上商品の返品は、売上高から直接控除するため「売上（収益）」の減少（借方）とします。",
    options: ["売上", "売掛金"],
    debit: [{ account: "売上", amount: 20000 }],
    credit: [{ account: "売掛金", amount: 20000 }],
    explanation: "販売時の逆仕訳により、売上高の減額と売掛金の減額を計上します。"
  },
  {
    id: "Q005",
    category: "キャッシュレス決済",
    statement: "一般顧客に対して商品 ￥120,000 を販売し、代金はクレジットカードで決済された。信販会社への手数料（販売代金の 2%）は販売時に計上する。",
    hint: "信販会社への未回収金は「クレジット売掛金」、控除分（120,000×2%＝2,400円）は「支払手数料」です。",
    options: ["クレジット売掛金", "支払手数料", "売上"],
    debit: [{ account: "クレジット売掛金", amount: 117600 }, { account: "支払手数料", amount: 2400 }],
    credit: [{ account: "売上", amount: 120000 }],
    explanation: "売上高 120,000円に対し、決済手数料 2,400円を「支払手数料」、差額 117,600円を「クレジット売掛金」とします。"
  },
  {
    id: "Q006",
    category: "商品売買・手付金の受取",
    statement: "得意先より商品 ￥300,000 の注文を受け、手付金として ￥60,000 を現金で受け取った。",
    hint: "商品の引き渡し前に受け取った手付金は「前受金（負債）」として貸方に計上します。",
    options: ["現金", "前受金", "売上"],
    debit: [{ account: "現金", amount: 60000 }],
    credit: [{ account: "前受金", amount: 60000 }],
    explanation: "手付金の受取により現金を借方に計上し、将来の商品引渡義務を「前受金（負債）」として貸方に計上します。"
  },
  {
    id: "Q007",
    category: "商品売買・返品（返戻）",
    statement: "仕入れた商品のうち、品違いのため ￥25,000 を返品し、買掛金と相殺した。",
    hint: "仕入商品の返品は、総仕入高から直接減額します。",
    options: ["買掛金", "仕入"],
    debit: [{ account: "買掛金", amount: 25000 }],
    credit: [{ account: "仕入", amount: 25000 }],
    explanation: "購入時の逆仕訳により、「買掛金」の減少（借方）と「仕入」高の減額（貸方）を計上します。"
  },
  {
    id: "Q008",
    category: "商品売買・発送費（売手負担）",
    statement: "商品 ￥180,000 を掛けで販売した。なお、当店負担の発送運賃 ￥3,000 は現金で支払った。",
    hint: "売手（当店）が負担する発送運賃は「発送費（費用）」として計上します。",
    options: ["売掛金", "発送費", "売上", "現金"],
    debit: [{ account: "売掛金", amount: 180000 }, { account: "発送費", amount: 3000 }],
    credit: [{ account: "売上", amount: 180000 }, { account: "現金", amount: 3000 }],
    explanation: "売上高 180,000円と売掛金を計上し、当店負担の発送費用 3,000円を「発送費」として処理します。"
  },
  {
    id: "Q009",
    category: "商品売買・前払金の精算",
    statement: "以前に注文を行っていた商品 ￥400,000 が到着し、内金 ￥80,000 を差し引いた残額を掛けとした。",
    hint: "商品の受入により「仕入」を計上し、既払の内金「前払金」を取り崩します。",
    options: ["仕入", "前払金", "買掛金"],
    debit: [{ account: "仕入", amount: 400000 }],

    statement: "決算にあたり、売掛金 ￥100,000 の回収として受け取っていた小切手 ￥100,000（他店振出）の未記帳が判明したため、適切に処理する。",
    hint: "未処理の他店振出小切手受領：「現金」の増加と「売掛金」の減少です。",
    options: ["現金", "売掛金"],
    debit: [{ account: "現金", amount: 100000 }],
    credit: [{ account: "売掛金", amount: 100000 }],
    explanation: "未記帳であった「現金」の加算と「売掛金」の減額修正を行います。"
  }
];

// 有効問題IDマップの生成（バリデーション用）
const VALID_QUESTION_IDS = new Set(QUESTION_DATABASE.map(q => q.id));

// 移行元バージョンに応じた累積パージ対象マップ（sourceVersion以降に変更された全IDを網羅）
const PURGE_BY_SOURCE_VERSION = {
  "v5": new Set(["Q006", "Q008", "Q011", "Q013", "Q014", "Q022", "Q030", "Q050", "Q051", "Q093"]),
  "v6.0": new Set(["Q006", "Q008", "Q011", "Q013", "Q014", "Q022", "Q030", "Q050", "Q051", "Q093"]),
  "v6.1": new Set(["Q006", "Q008", "Q011", "Q022", "Q050", "Q051"]),
  "v6.2": new Set(["Q006", "Q022"]),
  "v6.3": new Set(["Q022"]),
  "v6.4": new Set()
};

// --- 堅牢な LocalStorage 管理クラス (累積パージ対応) ---
class StorageManager {
  static KEY_V6 = 'boki3_system_state_v6';
  static KEY_V5 = 'boki3_system_state_v5';
  static VERSION = 'v6.4';

  static loadState() {
    const defaultState = this.getDefaultState();
    try {
      let isFromV5 = false;
      let serialized = localStorage.getItem(this.KEY_V6);
      
      // v6が存在せずv5が存在する場合の移行(Migration)対応
      if (!serialized) {
        const v5Serialized = localStorage.getItem(this.KEY_V5);
        if (v5Serialized) {
          serialized = v5Serialized; // v5のデータ構造を引き継ぎ
          isFromV5 = true;
        }
      }

      if (!serialized) return defaultState;
      const parsed = JSON.parse(serialized);
      if (typeof parsed !== 'object' || parsed === null) return defaultState;

      const sourceVersion = isFromV5 ? "v5" : (parsed.bankVersion || "v6.0");
      const purgeSet = PURGE_BY_SOURCE_VERSION[sourceVersion] || PURGE_BY_SOURCE_VERSION["v6.0"];

      // 厳格なバリデーションとサニタイズ
      const sanitizedProgress = {};
      if (typeof parsed.progress === 'object' && parsed.progress !== null) {
        Object.keys(parsed.progress).forEach(id => {
          if (VALID_QUESTION_IDS.has(id)) {
            // 移行元バージョン以降に変更された問題の古い学習進捗を累積パージ
            if (purgeSet && purgeSet.has(id)) {
              return;
            }

            const item = parsed.progress[id];
            if (item && typeof item === 'object') {
              const interval = Number.isFinite(item.intervalDays) && item.intervalDays >= 0 ? Math.floor(item.intervalDays) : 0;
              const rep = Number.isFinite(item.repetitionCount) && item.repetitionCount >= 0 ? Math.floor(item.repetitionCount) : 0;
              const ease = Number.isFinite(item.easeFactor) && item.easeFactor >= 1.3 && item.easeFactor <= 5.0 ? item.easeFactor : 2.50;
              const nextDate = typeof item.nextReviewDate === 'string' && !isNaN(Date.parse(item.nextReviewDate)) ? item.nextReviewDate : new Date().toISOString();
              const lastRev = typeof item.lastReviewed === 'string' && !isNaN(Date.parse(item.lastReviewed)) ? item.lastReviewed : new Date().toISOString();

              sanitizedProgress[id] = {
                intervalDays: interval,
                repetitionCount: rep,
                easeFactor: parseFloat(ease.toFixed(2)),
                nextReviewDate: nextDate,
                lastReviewed: lastRev
              };
            }
          }
        });
      }

      const streakVal = Number.isFinite(parsed.streak) && parsed.streak >= 0 ? Math.floor(parsed.streak) : 0;
      const todayVal = Number.isFinite(parsed.todayCount) && parsed.todayCount >= 0 ? Math.floor(parsed.todayCount) : 0;
      const lastDateVal = typeof parsed.lastStudyDate === 'string' && !isNaN(Date.parse(parsed.lastStudyDate)) ? parsed.lastStudyDate : null;

      return {
        bankVersion: this.VERSION,
        progress: sanitizedProgress,
        streak: streakVal,
        lastStudyDate: lastDateVal,
        todayCount: todayVal
      };
    } catch (e) {
      console.error('LocalStorage load failed, fallback to default state:', e);
      return defaultState;
    }
  }

  static saveState(state) {
    try {
      state.bankVersion = this.VERSION;
      localStorage.setItem(this.KEY_V6, JSON.stringify(state));
    } catch (e) {
      console.error('Failed to save state to LocalStorage:', e);
      alert('【警告】ブラウザの保存領域（LocalStorage）に空きがないため、学習履歴が更新できません。');
    }
  }

  static getDefaultState() {
    return { bankVersion: this.VERSION, progress: {}, streak: 0, lastStudyDate: null, todayCount: 0 };
  }
}

// アプリケーション状態変数
let state = StorageManager.loadState();
let currentQuestionIndex = -1;
let currentErrorType = 'NONE';
let isAnswered = false; // 採点完了フラグ
let isEvalCompleted = false; // 自己評価完了フラグ

function getTodayString() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function checkDailyStreak() {
  const today = getTodayString();
  if (!state.lastStudyDate) return;

  const lastDate = new Date(state.lastStudyDate);
  const currentDate = new Date(today);
  const diffDays = Math.round((currentDate - lastDate) / (1000 * 60 * 60 * 24));

  if (diffDays > 1) {
    state.streak = 0;
    state.todayCount = 0;
    StorageManager.saveState(state);
  } else if (state.lastStudyDate !== today) {
    state.todayCount = 0;
    StorageManager.saveState(state);
  }
}

function setEvalButtonsDisabled(disabled, isCorrect = false) {
  const btn0 = document.getElementById('eval-btn-0');
  const btn2 = document.getElementById('eval-btn-2');
  const btn3 = document.getElementById('eval-btn-3');

  if (disabled) {
    [btn0, btn2, btn3].forEach(btn => { if (btn) btn.disabled = true; });
  } else {
    if (btn0) btn0.disabled = false;
    if (btn2) btn2.disabled = !isCorrect;
    if (btn3) btn3.disabled = !isCorrect;
  }

  const instruction = document.getElementById('eval-instruction');
  if (instruction) {
    if (disabled) {
      instruction.innerText = '※採点（解答提出）を完了すると自覚難易度の選択が可能になります:';
    } else if (!isCorrect) {
      instruction.innerText = '※不正解のため「要復習 / 不正解」で復習間隔が自動再設定されます:';
    } else {
      instruction.innerText = '自覚難易度の選択（選択後に次の問題へ自動進みます）:';
    }
  }
}

function setInputFieldsDisabled(disabled) {
  const selects = document.querySelectorAll('.journal-table select');
  const inputs = document.querySelectorAll('.journal-table input');
  const removeBtns = document.querySelectorAll('.btn-remove-row');
  const addBtn = document.getElementById('add-row-btn');
  const submitBtn = document.getElementById('submit-btn');

  selects.forEach(s => s.disabled = disabled);
  inputs.forEach(i => i.disabled = disabled);
  removeBtns.forEach(b => b.disabled = disabled);
  if (addBtn) addBtn.disabled = disabled;
  if (submitBtn) submitBtn.disabled = disabled;
}

function updateDashboard() {
  checkDailyStreak();

  const total = QUESTION_DATABASE.length;
  let dueCount = 0;
  let unstudiedCount = 0;
  let totalEase = 0;
  const now = new Date();

  QUESTION_DATABASE.forEach(q => {
    const p = state.progress[q.id];
    if (p) {
      if (new Date(p.nextReviewDate) <= now) dueCount++;
      totalEase += p.easeFactor;
    } else {
      unstudiedCount++;
      totalEase += 2.5;
    }
  });

  document.getElementById('stat-total').innerText = total;
  document.getElementById('stat-due').innerText = dueCount;
  document.getElementById('stat-unstudied').innerText = unstudiedCount;
  document.getElementById('stat-streak').innerText = `${state.streak} 日`;
  document.getElementById('stat-ease').innerText = (totalEase / total).toFixed(2);

  const dailyTarget = 10;
  const percent = Math.min(Math.round((state.todayCount / dailyTarget) * 100), 100);
  document.getElementById('progress-bar').style.width = `${percent}%`;
  document.getElementById('progress-text').innerText = `${state.todayCount} / ${dailyTarget} 問完了`;
}

// --- 間隔反復（SM-2改）優先出題アルゴリズム ---
function getNextQuestionIndex() {
  const now = new Date();
  const dueIndices = [];
  const unstudiedIndices = [];

  QUESTION_DATABASE.forEach((q, idx) => {
    const p = state.progress[q.id];
    if (!p) {
      unstudiedIndices.push(idx);
    } else if (new Date(p.nextReviewDate) <= now) {
      dueIndices.push(idx);
    }
  });

  // 1. 本日復習期日が来ている問題を優先出題
  if (dueIndices.length > 0) {
    const candidates = dueIndices.filter(i => i !== currentQuestionIndex);
    return candidates.length > 0 ? candidates[Math.floor(Math.random() * candidates.length)] : dueIndices[0];
  }

  // 2. 未学習問題を優先出題
  if (unstudiedIndices.length > 0) {
    const candidates = unstudiedIndices.filter(i => i !== currentQuestionIndex);
    return candidates.length > 0 ? candidates[Math.floor(Math.random() * candidates.length)] : unstudiedIndices[0];
  }

  // 3. 復習待ち・未学習がすべて完了した場合
  return -1;
}

function loadQuestion(index) {
  const quizCard = document.getElementById('quiz-card');

  if (index === -1) {
    currentQuestionIndex = -1;
    quizCard.innerHTML = `
      <div class="completion-message">
        <h2>本日の学習・復習はすべて完了しました。</h2>
        <p>復習期限が到来している問題、および未学習の問題は現在ありません。</p>
        <p style="color: var(--text-muted); font-size: 0.9rem;">次回アクセス時、復習期日が到来した問題が自動出題されます。</p>
      </div>
    `;
    return;
  }

  if (index < 0 || index >= QUESTION_DATABASE.length) index = 0;
  currentQuestionIndex = index;
  isAnswered = false;
  isEvalCompleted = false;

  setEvalButtonsDisabled(true);

  const q = QUESTION_DATABASE[index];

  document.getElementById('problem-category').innerText = q.category;
  document.getElementById('problem-id-text').innerText = `ID: ${q.id} (${index + 1} / ${QUESTION_DATABASE.length})`;
  document.getElementById('problem-statement').innerText = q.statement;

  const hintBox = document.getElementById('hint-box');
  hintBox.innerText = q.hint || "ヒントはありません。問題文の仕訳構造を考えましょう。";
  hintBox.style.display = 'none';

  document.getElementById('result-box').style.display = 'none';

  const tbody = document.getElementById('journal-rows');
  if (tbody) {
    tbody.innerHTML = '';
    const initialRows = Math.max(q.debit.length, q.credit.length, 1);
    for (let i = 0; i < initialRows; i++) {
      addJournalRow();
    }
  }

  // 次の問題読み込み時に仕訳表の横スクロール位置を最左端（借方側）へリセット
  const wrapper = document.getElementById('journal-wrapper');
  if (wrapper) {
    wrapper.scrollLeft = 0;
  }

  setInputFieldsDisabled(false);
}

function addJournalRow() {
  const tbody = document.getElementById('journal-rows');
  if (!tbody || currentQuestionIndex === -1 || isAnswered) return;
  const q = QUESTION_DATABASE[currentQuestionIndex];

  const tr = document.createElement('tr');

  let optionsHtml = '<option value="">(選択)</option>';
  q.options.forEach(opt => {
    optionsHtml += `<option value="${escapeHtml(opt)}">${escapeHtml(opt)}</option>`;
  });

  tr.innerHTML = `
    <td><select class="debit-account">${optionsHtml}</select></td>
    <td><input type="number" class="debit-amount" placeholder="0" min="0" step="100"></td>
    <td><select class="credit-account">${optionsHtml}</select></td>
    <td><input type="number" class="credit-amount" placeholder="0" min="0" step="100"></td>
    <td><button type="button" class="btn-remove-row" onclick="removeJournalRow(this)">✕</button></td>
  `;
  tbody.appendChild(tr);
}

function removeJournalRow(btn) {
  const tbody = document.getElementById('journal-rows');
  if (!tbody || isAnswered) return;
  if (tbody.children.length > 1) {
    btn.closest('tr').remove();
  } else {
    const tr = tbody.children[0];
    tr.querySelectorAll('select').forEach(s => s.value = '');
    tr.querySelectorAll('input').forEach(i => i.value = '');
  }
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, function(m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
  });
}

function toggleHint() {
  const hintBox = document.getElementById('hint-box');
  if (hintBox) {
    hintBox.style.display = (hintBox.style.display === 'block') ? 'none' : 'block';
  }
}

function getEntries(side) {
  const accounts = document.querySelectorAll(`.${side}-account`);
  const amounts = document.querySelectorAll(`.${side}-amount`);
  const entries = [];
  let hasIncomplete = false;

  for (let i = 0; i < accounts.length; i++) {
    const acc = accounts[i].value;
    const rawAmt = amounts[i].value;
    
    // 金額の厳格な正の整数バリデーション（小数・0・負数の排除）
    const numAmt = Number(rawAmt);
    const isValidInteger = rawAmt !== "" && Number.isInteger(numAmt) && numAmt > 0;

    if (acc && !isValidInteger) {
      hasIncomplete = true;
    } else if (!acc && rawAmt !== "") {
      hasIncomplete = true;
    } else if (acc && isValidInteger) {
      entries.push({ account: acc, amount: numAmt });
    }
  }
  return { entries, hasIncomplete };
}

function normalizeAndCompare(userEntries, correctEntries) {
  const aggregate = (entries) => {
    const map = {};
    entries.forEach(e => {
      map[e.account] = (map[e.account] || 0) + e.amount;
    });
    return Object.keys(map).map(k => ({ account: k, amount: map[k] })).sort((a, b) => a.account.localeCompare(b.account));
  };

  const normUser = aggregate(userEntries);
  const normCorrect = aggregate(correctEntries);

  if (normUser.length !== normCorrect.length) return false;

  for (let i = 0; i < normUser.length; i++) {
    if (normUser[i].account !== normCorrect[i].account || normUser[i].amount !== normCorrect[i].amount) {
      return false;
    }
  }
  return true;
}

function checkAnswer() {
  if (currentQuestionIndex === -1 || isAnswered) return;

  const q = QUESTION_DATABASE[currentQuestionIndex];
  const debitRes = getEntries('debit');
  const creditRes = getEntries('credit');

  if (debitRes.hasIncomplete || creditRes.hasIncomplete) {
    alert('【注意】勘定科目のみ、または金額のみが入力されているか、金額に小数や0以下の不正な数値が含まれています。正しく正の整数で入力してから提出してください。');
    return;
  }

  const debitCorrect = normalizeAndCompare(debitRes.entries, q.debit);
  const creditCorrect = normalizeAndCompare(creditRes.entries, q.credit);
  const isAllCorrect = debitCorrect && creditCorrect;

  const resultBox = document.getElementById('result-box');
  const resultTitle = document.getElementById('result-title');
  const resultDetail = document.getElementById('result-detail');
  const correctJournalContent = document.getElementById('correct-journal-content');
  const expBox = document.getElementById('explanation-box');

  resultBox.style.display = 'block';
  isAnswered = true; // 採点完了

  // 初回採点後の入力欄および採点ボタンのロック
  setInputFieldsDisabled(true);
  setEvalButtonsDisabled(false, isAllCorrect);

  if (isAllCorrect) {
    resultBox.className = 'result-box correct';
    resultTitle.innerText = '正解';
    resultDetail.innerText = '借方・貸方の勘定科目および金額が完全に一致しています。';
    currentErrorType = 'NONE';
  } else {
    resultBox.className = 'result-box incorrect';
    resultTitle.innerText = '不正解';

    // 行分割・重複科目を集約してSet比較する堅牢な科目判定ロジック
    const isAccountsMatch = (entriesA, entriesB) => {
      const setA = Array.from(new Set(entriesA.map(e => e.account))).sort().join(',');
      const setB = Array.from(new Set(entriesB.map(e => e.account))).sort().join(',');
      return setA === setB;
    };

    // 精密誤答分類判定
    if (isAccountsMatch(debitRes.entries, q.debit) && isAccountsMatch(creditRes.entries, q.credit)) {
      currentErrorType = 'CALCULATION';
      resultDetail.innerText = '勘定科目は正解ですが、計算金額に誤りがあります。';
    } else if (!debitCorrect && !creditCorrect) {
      currentErrorType = 'CONCEPT';
      resultDetail.innerText = '借方・貸方ともに不一致です。問題文の仕訳構造と取引概念を確認してください。';
    } else {
      currentErrorType = 'ACCOUNT_ITEM';
      resultDetail.innerText = '勘定科目の選択にミスがあります。指定された許容科目を確認してください。';
    }
  }

  // 正解仕訳の表描画
  if (correctJournalContent) {
    const debitHtml = q.debit.map(e => `<div style="display:flex; justify-content:space-between; margin-bottom:4px; gap:8px;"><span>${escapeHtml(e.account)}</span><span style="font-weight:600;">￥${e.amount.toLocaleString()}</span></div>`).join('');
    const creditHtml = q.credit.map(e => `<div style="display:flex; justify-content:space-between; margin-bottom:4px; gap:8px;"><span>${escapeHtml(e.account)}</span><span style="font-weight:600;">￥${e.amount.toLocaleString()}</span></div>`).join('');
    
    correctJournalContent.innerHTML = `
      <table class="correct-journal-table">
        <thead>
          <tr>
            <th class="th-debit" style="width: 50%;">借方</th>
            <th class="th-credit" style="width: 50%;">貸方</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>${debitHtml}</td>
            <td>${creditHtml}</td>
          </tr>
        </tbody>
      </table>
    `;
  }

  expBox.innerText = q.explanation;
}

function applySelfEval(quality) {
  if (!isAnswered || currentQuestionIndex === -1 || isEvalCompleted) {
    alert('「解答を提出する」ボタンを押して採点を行ってから自己評価を選択してください。');
    return;
  }

  const q = QUESTION_DATABASE[currentQuestionIndex];
  const today = getTodayString();

  // タブ放置エッジケースに対応した正確な Streak・todayCount・日付更新計算
  if (!state.lastStudyDate) {
    state.streak = 1;
    state.todayCount = 1;
    state.lastStudyDate = today;
  } else if (state.lastStudyDate !== today) {
    const last = new Date(state.lastStudyDate);
    const current = new Date(today);
    const diffDays = Math.round((current - last) / (1000 * 3600 * 24));
    
    if (diffDays === 1) {
      state.streak += 1;
    } else {
      state.streak = 1; // 日付が飛んでいる場合はリセット
    }
    state.todayCount = 1; // 日を跨いでいるため当日の件数を1件目でリセット
    state.lastStudyDate = today;
  } else {
    state.todayCount += 1;
  }

  let p = state.progress[q.id] || {
    intervalDays: 0,
    repetitionCount: 0,
    easeFactor: 2.50,
    nextReviewDate: new Date().toISOString()
  };

  let { intervalDays, repetitionCount, easeFactor } = p;

  if (quality < 2) {
    repetitionCount = 0;
    intervalDays = 1;
  } else {
    if (repetitionCount === 0) intervalDays = 1;
    else if (repetitionCount === 1) intervalDays = 3;
    else intervalDays = Math.round(intervalDays * easeFactor);
    repetitionCount++;
  }

  // Ease Factor の補正計算
  easeFactor = easeFactor + (0.1 - (3 - quality) * (0.08 + (3 - quality) * 0.02));
  if (currentErrorType === 'ACCOUNT_ITEM') easeFactor -= 0.05;
  if (currentErrorType === 'CONCEPT') easeFactor -= 0.10;
  if (currentErrorType === 'CALCULATION') easeFactor -= 0.03;
  if (easeFactor < 1.3) easeFactor = 1.3;
  if (easeFactor > 5.0) easeFactor = 5.0;

  const nextDate = new Date();
  nextDate.setDate(nextDate.getDate() + intervalDays);

  state.progress[q.id] = {
    intervalDays,
    repetitionCount,
    easeFactor: parseFloat(easeFactor.toFixed(2)),
    nextReviewDate: nextDate.toISOString(),
    lastReviewed: new Date().toISOString()
  };

  isEvalCompleted = true;

  // 状態変更時の保存・画面更新・自動次問題遷移
  StorageManager.saveState(state);
  updateDashboard();
  nextQuestion();
}

function nextQuestion() {
  const nextIdx = getNextQuestionIndex();
  loadQuestion(nextIdx);
}

window.addEventListener('DOMContentLoaded', () => {
  updateDashboard();
  nextQuestion(); // 起動時も復習優先スケジュールに従って読み込み
});
</script>
